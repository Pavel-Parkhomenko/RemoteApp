<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 10px;
      font-family: Arial;
    }

    input {
      width: 100%;
      padding: 5px;
      margin: 5px 0;
    }

    button {
      width: 100%;
      padding: 8px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    #result {
      margin-top: 10px;
      font-size: 13px;
      background: #f0f0f0;
      padding: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .span_text {
      color: #7a0a80;
    }

    .box-input_selector {
      display: flex;
      flex-direction: row;
      align-items: center;
      background-color: #330d3b;
      padding: 5px;
      margin-bottom: 5px;
    }

    .box-input_selector input {
      margin: 0;
    }

    .text_selector {
      margin: 0;
      padding: 0;
      color: white
    }
  </style>
</head>

<body>
  <p><a href="https://github.com/Pavel-Parkhomenko/RemoteApp"><span class="span_text">YAnim</span></a> - поиск серий на
    <span class="span_text">yummyani.me</span>
  </p>
  <div class="box-input_selector">
    <span class="text_selector">div.</span><input placeholder="poster" type="text" id="input-poster_sel" />
    <span class="text_selector">div.</span><input placeholder="common" type="text" id="input-common_sel" />
    <input placeholder="series" type="text" id="input-series_sel" />
  </div>
  <button id="parseBtn">Поиск</button>
  <div id="result"></div>
  <script src="popup.js"></script>
</body>

</html>
